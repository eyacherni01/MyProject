<div class="container">
  <h2>Liste des suggestions</h2>

  <!-- Barre de recherche -->
  <div class="search-container">
    <input type="text" placeholder="Rechercher par titre" [(ngModel)]="searchText" class="search-bar">
    <input type="text" placeholder="Rechercher par catégorie" [(ngModel)]="searchCategory" class="search-bar">
  </div>

  <div *ngFor="let s of filteredSuggestions()" class="suggestion-card">
    <h3 class="suggestion-title">{{ s.title }}</h3>
    <p class="description">{{ s.description }}</p>
    
    <div class="meta">
      <span><strong>Catégorie :</strong> {{ s.category }}</span>
      <span><strong>Date :</strong> {{ s.date | date:'dd/MM/yyyy' }}</span>
      <span><strong>Likes :</strong> {{ s.nbLikes }}</span>
    </div>

    <span class="status"
          [ngClass]="{
            'status-acceptee': s.status === 'acceptee',
            'status-refusee': s.status === 'refusee',
            'status-en-attente': s.status === 'en_attente'
          }">
      {{ s.status }}
    </span>

    <div class="actions">
  <ng-container *ngIf="s.status !== 'refusee'">
    <button class="btn-like" (click)="likeSuggestion(s)">👍 Like</button>
    <button class="btn-favorite" (click)="addToFavorites(s)">⭐ Favoris</button>
  </ng-container>

  <button class="btn-details" (click)="goDetails(s)">👁️ Voir détails</button>
</div>
    

  <div class="favorites-section">
    <h2>Suggestions favorites</h2>
    <ul>
      <li *ngFor="let f of favorites">{{ f.title }}</li>
    </ul>
    <p *ngIf="favorites.length === 0">Aucune suggestion favorite pour le moment.</p>
  </div>
  
</div>
