<div class="details-container" *ngIf="suggestion">
  <h2>Détails de la suggestion</h2>

  <p><strong>ID :</strong> {{ suggestion.id }}</p>
  <p><strong>Titre :</strong> {{ suggestion.title }}</p>
  <p><strong>Description :</strong> {{ suggestion.description }}</p>
  <p><strong>Catégorie :</strong> {{ suggestion.category }}</p>
  <p><strong>Date :</strong> {{ suggestion.date | date:'dd/MM/yyyy' }}</p>
  <p><strong>Status :</strong> {{ suggestion.status }}</p>
  <p><strong>Likes :</strong> {{ suggestion.nbLikes }}</p>
  
<button class="btn-update" (click)="goUpdate()">✏ Modifier</button>
<button class="btn-back" (click)="back()">⬅ Retour</button>

</div>
