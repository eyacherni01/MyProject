<div class="user-page">
  <div class="user-card">
    <h2>Ajouter un utilisateur</h2>
    <p class="subtitle">Remplis les informations ci-dessous.</p>

    <form [formGroup]="userForm" (ngSubmit)="adduser()">
      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          [class.invalid]="email?.invalid && (email?.dirty || email?.touched)"
        />

        <small class="error" *ngIf="email?.errors && (email?.dirty || email?.touched)">
          <span *ngIf="email?.errors?.['required']">Email obligatoire.</span>
          <span *ngIf="email?.errors?.['email']">Email invalide.</span>
        </small>
      </div>

      <!-- City -->
      <div class="form-group">
        <label>Ville</label>
        <input
          type="text"
          formControlName="city"
          [class.invalid]="city?.invalid && (city?.dirty || city?.touched)"
        />

        <small class="error" *ngIf="city?.errors && (city?.dirty || city?.touched)">
          <span *ngIf="city?.errors?.['required']">Ville obligatoire.</span>
        </small>
      </div>

      <button class="btn-submit" type="submit" [disabled]="userForm.invalid">
        ➕ Ajouter
      </button>
    </form>
  </div>
</div>
